{% extends 'base.html' %}

{% block title %}400 Bad Request - Smart Campus Analytics{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-warning fw-bold"><i class="bi bi-shield-exclamation"></i> 400</div>
    <h2 class="fw-bold mt-3">Invalid Request</h2>
    <p class="text-muted max-w-lg mx-auto">
        The server could not understand or validate the request parameters. Please verify your inputs and try again.
    </p>
    <a href="{% url 'landing' %}" class="btn btn-outline-primary rounded-pill px-4 mt-3">
        <i class="bi bi-house"></i> Return to Homepage
    </a>
</div>
{% endblock %}
