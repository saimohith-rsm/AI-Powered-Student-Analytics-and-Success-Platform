{% extends 'base.html' %}

{% block title %}Smart Campus Analytics - AI Student Success Platform{% endblock %}

{% block full_width_content %}
<div class="hero-section landing-hero d-flex align-items-center justify-content-center text-center position-relative">
    <div class="container py-4" style="max-width: 900px;">
        <h1 class="hero-title mb-4 fw-bold text-white">
            AI-Powered Student Analytics & Success Platform
        </h1>

        <div class="d-flex justify-content-center">
            <a href="{% if user.is_authenticated %}{% url 'accounts:dashboard_redirect' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="btn btn-info btn-cyan btn-lg px-5 py-3 rounded-pill fw-semibold shadow-lg text-white">
                <i class="bi bi-box-arrow-in-right me-2"></i> Access Platform Portal
            </a>
        </div>
    </div>
</div>
{% endblock %}
